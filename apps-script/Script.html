<script>
  // ---------- État ----------
  const etat = {
    annee: new Date().getFullYear(),
    mois: new Date().getMonth(), // 0 = janvier
    filtre: 'tous',
    voirPasses: false,  // affiche aussi les évènements terminés
    categories: { jds: [], jdr: [] },
    evenements: [],
    enCours: null,      // évènement (ou modèle) ouvert dans le formulaire
    portee: null,       // 'occurrence' | 'serie' | null
    mode: 'evenement',  // 'evenement' | 'modele' : ce que le formulaire enregistre
    charte: { modeles: [], textes: [] },
    texteEnCours: null  // texte type ouvert dans son formulaire
  };
  const CANAUX = ['vibes', 'meetup', 'discord', 'instagram'];
  // Même règle que TITRE_ANNULE (Conventions.gs)
  const TITRE_ANNULE = /^\s*ANNUL[ÉE]E?(?![\p{L}])\s*[-–—:]?\s*/iu;

  const $ = sel => document.querySelector(sel);
  const form = $('#form');

  // Appel d'une fonction serveur sous forme de promesse
  function appel(nom, ...args) {
    return new Promise((ok, ko) => {
      google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[nom](...args);
    });
  }

  // Petit constructeur d'éléments (textContent : aucun HTML injecté)
  function el(tag, attrs, ...enfants) {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'class') n.className = v;
      else if (k === 'style') n.style.cssText = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    enfants.flat().forEach(e => { if (e != null && e !== false) n.append(e); });
    return n;
  }

  // ---------- Dates ----------
  const pad = n => String(n).padStart(2, '0');
  const dateStr = (a, m, j) => `${a}-${pad(m + 1)}-${pad(j)}`;
  const versDate = s => { const [a, m, j] = s.split('-').map(Number); return new Date(a, m - 1, j); };
  const aujourdhui = () => { const d = new Date(); return dateStr(d.getFullYear(), d.getMonth(), d.getDate()); };
  const heureFr = h => h ? h.replace(':', 'h') : '';
  const jourLong = s => versDate(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

  // ---------- Chargement ----------
  function chargerMois() {
    const debut = dateStr(etat.annee, etat.mois, 1);
    const suivant = new Date(etat.annee, etat.mois + 1, 1);
    const fin = dateStr(suivant.getFullYear(), suivant.getMonth(), 1);
    $('#titre-mois').textContent = new Date(etat.annee, etat.mois, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    $('#statut').textContent = 'Chargement…';
    $('#statut').classList.remove('erreur');
    return appel('chargerDonnees', debut, fin).then(d => {
      etat.categories = d.categories;
      etat.evenements = d.evenements;
      $('#utilisateur').textContent = d.utilisateur;
      $('#statut').textContent = '';
      afficherListe();
    }).catch(e => {
      $('#statut').textContent = '❌ ' + e.message;
      $('#statut').classList.add('erreur');
    });
  }

  function categorieDe(ev) {
    return (etat.categories[ev.calendrier] || []).find(c => c.colorId === ev.colorId);
  }

  // ---------- Liste ----------
  // Terminé = l'heure de fin est passée (fin du dernier jour pour une journée entière)
  function estTermine(ev) {
    const fin = ev.journeeEntiere ? (ev.dateFin || ev.date) + 'T23:59:59' : (ev.dateFin || ev.date) + 'T' + ev.heureFin;
    return new Date(fin) < new Date();
  }

  function afficherListe() {
    const liste = $('#liste');
    liste.textContent = '';
    const duCalendrier = etat.evenements.filter(e => etat.filtre === 'tous' || e.calendrier === etat.filtre);
    const nbTermines = duCalendrier.filter(estTermine).length;
    const evts = duCalendrier
      .filter(e => etat.voirPasses || !estTermine(e))
      .sort((a, b) => (a.date + (a.heureDebut || '')).localeCompare(b.date + (b.heureDebut || '')));

    if (nbTermines) {
      liste.append(el('p', { class: 'bascule-passes' },
        el('button', { type: 'button', class: 'btn btn-lien', 'aria-pressed': String(etat.voirPasses),
          onclick: () => { etat.voirPasses = !etat.voirPasses; afficherListe(); } },
          etat.voirPasses ? '🙈 Masquer les évènements passés' : `🕘 Voir les évènements passés (${nbTermines})`)
      ));
    }
    if (!evts.length) {
      liste.append(el('p', { class: 'vide' }, nbTermines ? 'Aucun évènement à venir ce mois-ci.' : 'Aucun évènement ce mois-ci.'));
      return;
    }
    const parJour = {};
    evts.forEach(e => (parJour[e.date] = parJour[e.date] || []).push(e));
    const ajd = aujourdhui();
    Object.keys(parJour).sort().forEach(jour => {
      liste.append(el('section', { class: 'jour' + (jour === ajd ? ' aujourdhui' : '') },
        el('h3', {}, jourLong(jour) + (jour === ajd ? ' · aujourd\'hui' : '')),
        parJour[jour].map(e => carte(e, estTermine(e)))
      ));
    });
  }

  function carte(ev, passe) {
    const cat = categorieDe(ev);
    const horaire = ev.journeeEntiere
      ? (ev.dateFin && ev.dateFin !== ev.date ? `Jusqu'au ${versDate(ev.dateFin).toLocaleDateString('fr-FR')}` : 'Journée')
      : `${heureFr(ev.heureDebut)} – ${heureFr(ev.heureFin)}`;
    return el('article', { class: 'evt' + (passe ? ' passe' : '') + (ev.annule ? ' annule' : ''), style: `border-left-color: ${cat ? cat.teinte : 'var(--texte-doux)'}` },
      el('div', { class: 'evt-heure' }, horaire),
      el('div', { class: 'evt-corps' },
        el('div', { class: 'evt-titre' }, ev.titre || '(sans titre)'),
        el('div', { class: 'badges' },
          ev.annule && el('span', { class: 'badge badge-annule', title: ev.annulation }, '🚫 Annulé'),
          el('span', { class: 'badge' }, ev.calendrier === 'jds' ? '🎯 JDS' : '⚔️ JDR'),
          el('span', { class: 'badge' }, cat ? cat.nom : 'Sans catégorie'),
          ev.visibilite === 'privee' && el('span', { class: 'badge' }, '🔒 Privé'),
          ev.serieId && el('span', { class: 'badge' }, '🔁 Série'),
          ev.inscription.mode === 'externe' && el('span', { class: 'badge' }, '🔗 Inscription externe'),
          !ev.annule && ev.inscription.mode === 'aucune' && el('span', { class: 'badge' }, '🚫 Pas d\'inscription'),
          ev.places.gerer && el('span', { class: 'badge' }, ev.places.complet ? '🎟️ Complet' : '🎟️ ' + ev.places.nombre + ' places'),
          !ev.annule && !ev.tarif.choix && (categorieDe(ev) || {}).tarifObligatoire && el('span', { class: 'badge' }, '⚠️ Tarif manquant'),
          ev.notesInternes && el('span', { class: 'badge', title: ev.notesInternes }, '🔐 Notes internes')
        )
      ),
      el('div', { class: 'evt-actions' },
        el('button', { type: 'button', class: 'btn btn-petit', onclick: () => apercu(ev) }, '👁️ Voir'),
        el('button', { type: 'button', class: 'btn btn-petit', onclick: () => modifier(ev) }, '✏️ Modifier'),
        el('button', { type: 'button', class: 'btn btn-petit', onclick: () => dupliquer(ev) }, '📄 Dupliquer'),
        el('button', { type: 'button', class: 'btn btn-petit', title: 'En faire un modèle', onclick: () => modeleDepuisEvenement(ev) }, '📌 Modèle'),
        !ev.annule && !passe && el('button', { type: 'button', class: 'btn btn-petit', onclick: () => annuler(ev) }, '🚫 Annuler'),
        el('button', { type: 'button', class: 'btn btn-petit', onclick: () => supprimer(ev) }, '🗑️ Supprimer')
      )
    );
  }

  // ---------- Formulaire ----------
  function remplirCategories(calendrier, colorId) {
    const select = form.colorId;
    select.textContent = '';
    select.append(el('option', { value: '' }, 'Sans catégorie'));
    (etat.categories[calendrier] || []).forEach(c => select.append(el('option', { value: c.colorId }, c.nom)));
    select.value = colorId || '';
    majAideCategorie();
  }

  function majAideCategorie() {
    const cal = form.calendrier.value;
    const cat = (etat.categories[cal] || []).find(c => c.colorId === form.colorId.value);
    const boutons = { inscription: '« ✋ Demander à m\'inscrire »', reservation: '« 🔑 Demander à réserver la salle »' };
    const salles = { bloque: 'bloque la salle', libre: 'salle réservable', ligue: 'priorité Ligue Ludique' };
    let aide = cat && cat.bouton ? 'Bouton ' + boutons[cat.bouton] : 'Pas de bouton sur le site';
    if (cal === 'jdr') aide += ' · ' + (cat ? salles[cat.salle] : 'bloque la salle');
    $('#aide-categorie').textContent = aide;
    $('#libelle-normal').textContent = cat && cat.bouton
      ? 'Bouton habituel : ' + boutons[cat.bouton]
      : 'Comportement habituel de la catégorie (ici : aucun bouton)';
    $('#aide-tarif').textContent = cat && cat.tarifObligatoire ? 'Obligatoire pour ' + cat.nom : '';
  }

  // Nouvel évènement ou modèle : valeurs proposées par la catégorie (charte § 2.4)
  function appliquerDefautsCategorie() {
    if (etat.enCours && etat.enCours.id) return;
    const cat = (etat.categories[form.calendrier.value] || []).find(c => c.colorId === form.colorId.value) || {};
    form.placesGerer.checked = !!cat.inscriptions;
    form.placesNombre.value = cat.places || '';
    form.placesInscription.value = cat.modePlaces || 'obligatoire';
    form.placesComplet.checked = false;
    majVisibiliteChamps();
  }

  function majVisibiliteChamps() {
    const modele = etat.mode === 'modele';
    const entiere = !modele && form.journeeEntiere.checked;
    $('#bloc-heures').hidden = entiere;
    $('#bloc-date-fin').hidden = !entiere;
    const modeInscription = form.querySelector('[name=inscriptionMode]:checked').value;
    form.inscriptionUrl.hidden = modeInscription !== 'externe';
    $('#bloc-canaux').hidden = modeInscription !== 'normal'; // liens utilisés seulement par le bouton habituel
    $('#alerte-mardi').hidden = modele || !form.date.value || versDate(form.date.value).getDay() !== 2;
    const freq = form.frequence.value;
    $('#bloc-fin-serie').hidden = freq === 'aucune' || freq === 'autre';
    $('#bloc-places').hidden = !form.placesGerer.checked;
    form.placesNombre.disabled = form.placesInscription.disabled = form.placesComplet.checked;
    $('#aide-complet').hidden = !form.placesComplet.checked;
    $('#bloc-tarif-montant').hidden = form.tarifChoix.value !== 'minimum';
    $('#bloc-tarif-texte').hidden = form.tarifChoix.value !== 'autre';
  }

  // Ouvre le formulaire. ev = valeurs de départ (évènement existant, copie, nouveau ou modèle).
  //   options.mode = 'modele' : le formulaire enregistre un modèle de la charte (sans date ni répétition)
  //   options.choixModele     : propose « Partir d'un modèle » (nouvel évènement)
  function ouvrirFormulaire(ev, titre, encart, options) {
    options = options || {};
    etat.enCours = ev;
    etat.mode = options.mode || 'evenement';
    const modele = etat.mode === 'modele';
    form.reset();
    $('#form-titre').textContent = titre;
    $('#form-portee').hidden = !encart;
    $('#form-portee').textContent = encart || '';
    $('#form-erreur').hidden = true;

    $('#bloc-nom-modele').hidden = !modele;
    form.nomModele.value = ev.nom || '';
    $('#bloc-date').hidden = modele;
    $('#bloc-choix-modele').hidden = !options.choixModele || !etat.charte.modeles.length;
    $('#choix-modele').value = '';
    form.calendrier.disabled = !modele && !!ev.id; // pour changer de calendrier : dupliquer puis supprimer
    // Répétition : seulement à la création ou pour toute la série
    $('#bloc-recurrence').hidden = modele || etat.portee === 'occurrence';

    remplirChamps(ev);
    $('#dlg-form').showModal();
    (modele ? form.nomModele : form.titre).focus();
  }

  function remplirChamps(ev) {
    form.calendrier.value = ev.calendrier;
    remplirCategories(ev.calendrier, ev.colorId);
    form.titre.value = ev.titre || '';
    form.annulation.value = ev.annulation || '';
    $('#bloc-annulation').hidden = etat.mode === 'modele' || !(ev.annule || ev.annulation);
    form.date.value = ev.date || '';
    form.journeeEntiere.checked = !!ev.journeeEntiere;
    form.heureDebut.value = ev.heureDebut || '19:00';
    form.heureFin.value = ev.heureFin || '23:00';
    form.dateFin.value = ev.dateFin || '';
    form.visibilite.value = ev.visibilite || 'publique';
    form.descriptionPublique.value = ev.descriptionPublique || '';
    form.notesInternes.value = ev.notesInternes || '';
    const insc = ev.inscription || { mode: 'normal', url: '' };
    form.querySelector(`[name=inscriptionMode][value=${insc.mode}]`).checked = true;
    form.inscriptionUrl.value = insc.url || '';
    const canaux = ev.canaux || {};
    CANAUX.forEach(c => { form['canal-' + c].value = canaux[c] || ''; });
    $('#bloc-canaux').open = Object.values(canaux).some(Boolean);
    const places = ev.places || {};
    form.placesGerer.checked = !!places.gerer;
    form.placesNombre.value = places.nombre || '';
    form.placesInscription.value = places.inscription || 'obligatoire';
    form.placesComplet.checked = !!places.complet;
    const tarif = ev.tarif || {};
    form.tarifChoix.value = tarif.choix || '';
    form.tarifMontant.value = tarif.montant || '';
    form.tarifTexte.value = tarif.texte || '';

    const rec = ev.recurrence || { frequence: 'aucune', fin: '' };
    form.querySelector('[name=frequence] option[value=autre]').hidden = rec.frequence !== 'autre';
    form.frequence.value = rec.frequence;
    form.finSerie.value = rec.fin || '';

    majVisibiliteChamps();
  }

  function lireFormulaire() {
    const ev = etat.enCours;
    return {
      id: ev.id || '',
      calendrier: form.calendrier.value,
      colorId: form.colorId.value,
      titre: form.titre.value,
      annulation: form.annulation.value,
      date: form.date.value,
      journeeEntiere: form.journeeEntiere.checked,
      heureDebut: form.heureDebut.value,
      heureFin: form.heureFin.value,
      dateFin: form.dateFin.value,
      visibilite: form.visibilite.value,
      descriptionPublique: form.descriptionPublique.value,
      notesInternes: form.notesInternes.value,
      inscription: {
        mode: form.querySelector('[name=inscriptionMode]:checked').value,
        url: form.inscriptionUrl.value
      },
      canaux: {
        vibes: form['canal-vibes'].value,
        meetup: form['canal-meetup'].value,
        discord: form['canal-discord'].value,
        instagram: form['canal-instagram'].value
      },
      places: {
        gerer: form.placesGerer.checked,
        nombre: form.placesNombre.value,
        inscription: form.placesInscription.value,
        complet: form.placesComplet.checked
      },
      tarif: { choix: form.tarifChoix.value, montant: form.tarifMontant.value, texte: form.tarifTexte.value },
      recurrence: { frequence: form.frequence.value, fin: form.finSerie.value }
    };
  }

  function enregistrer(e) {
    e.preventDefault();
    const bouton = $('#btn-enregistrer');
    bouton.disabled = true;
    bouton.textContent = 'Enregistrement…';
    $('#form-erreur').hidden = true;
    const envoi = etat.mode === 'modele'
      ? appel('enregistrerElementCharte', 'modeles', evenementVersModele(lireFormulaire(), form.nomModele.value, etat.enCours.id))
        .then(modeles => {
          etat.charte.modeles = modeles;
          $('#dlg-form').close();
          majCharte('✅ Modèle enregistré.');
          if (!$('#dlg-charte').open) $('#statut').textContent = '✅ Modèle enregistré : il est proposé dans « Nouvel évènement ».';
        })
      : appel('enregistrerEvenement', lireFormulaire())
        .then(() => {
          $('#dlg-form').close();
          return chargerMois().then(() => { $('#statut').textContent = '✅ Enregistré dans Google Agenda.'; });
        });
    envoi
      .catch(err => {
        $('#form-erreur').textContent = err.message;
        $('#form-erreur').hidden = false;
      })
      .finally(() => {
        bouton.disabled = false;
        bouton.textContent = 'Enregistrer';
      });
  }

  // ---------- Actions ----------
  function nouveau() {
    etat.portee = null;
    const ajd = aujourdhui();
    const premier = dateStr(etat.annee, etat.mois, 1);
    const date = ajd.slice(0, 7) === premier.slice(0, 7) ? ajd : premier;
    ouvrirFormulaire({ calendrier: etat.filtre === 'jdr' ? 'jdr' : 'jds', date }, 'Nouvel évènement', '', { choixModele: true });
    appliquerDefautsCategorie();
  }

  function dupliquer(ev) {
    etat.portee = null;
    const copie = Object.assign({}, sansAnnulation(ev), { id: '', serieId: '', recurrence: { frequence: 'aucune', fin: '' } });
    ouvrirFormulaire(copie, 'Dupliquer l\'évènement', 'Copie de « ' + ev.titre + ' » : change la date puis enregistre.');
  }

  function modifier(ev) {
    if (!ev.serieId) {
      etat.portee = null;
      ouvrirFormulaire(ev, 'Modifier l\'évènement');
      return;
    }
    demanderPortee(ev, 'Modifier').then(portee => {
      etat.portee = portee;
      if (portee === 'occurrence') {
        ouvrirFormulaire(ev, 'Modifier cette date', 'Tu modifies uniquement le ' + jourLong(ev.date) + '. Le reste de la série ne change pas.');
      } else if (portee === 'serie') {
        $('#statut').textContent = 'Chargement de la série…';
        appel('lireEvenement', ev.calendrier, ev.serieId).then(serie => {
          $('#statut').textContent = '';
          ouvrirFormulaire(serie, 'Modifier toute la série',
            'Tu modifies toute la série (elle commence le ' + jourLong(serie.date) + '). Les dates déjà modifiées une par une gardent leurs changements.');
        }).catch(e => { $('#statut').textContent = '❌ ' + e.message; });
      }
    });
  }

  function supprimer(ev) {
    const choix = ev.serieId ? demanderPortee(ev, 'Supprimer') : Promise.resolve('occurrence');
    choix.then(portee => {
      if (portee !== 'occurrence' && portee !== 'serie') return;
      const quoi = portee === 'serie' ? 'toute la série « ' + ev.titre + ' »' : '« ' + ev.titre + ' » du ' + jourLong(ev.date);
      confirmerSuppression('Supprimer ' + quoi + ' de Google Agenda ?', () =>
        appel('supprimerEvenement', ev.calendrier, ev.id, portee)
          .then(() => chargerMois())
          .then(() => { $('#statut').textContent = '🗑️ Supprimé.'; }));
    });
  }

  // ---------- Annulation ----------
  const titreSansAnnulation = titre => String(titre || '').replace(TITRE_ANNULE, '').trim();

  // Copie d'un évènement annulé (dupliquer, en faire un modèle) : sans « ANNULÉ - » ni raison
  function sansAnnulation(ev) {
    if (!ev.annule && !ev.annulation) return ev;
    const notes = (ev.notesInternes || '').split('\n')
      .filter(l => !/^\s*(Annulé le .* par |À annuler à la main :)/.test(l)).join('\n').trim();
    return Object.assign({}, ev, { titre: titreSansAnnulation(ev.titre), annule: false, annulation: '', notesInternes: notes });
  }

  function annuler(ev) {
    const choix = ev.serieId ? demanderPortee(ev, 'Annuler') : Promise.resolve('occurrence');
    choix.then(portee => {
      if (portee !== 'occurrence' && portee !== 'serie') return;
      const f = $('#form-annulation');
      f.reset();
      f.dataset.calendrier = ev.calendrier;
      f.dataset.id = ev.id;
      f.dataset.portee = portee;
      $('#annulation-texte').textContent = portee === 'serie'
        ? 'Annuler toute la série « ' + ev.titre + ' » ? Les dates déjà modifiées une par une ne changent pas : les annuler une par une.'
        : 'Annuler « ' + ev.titre + ' » du ' + jourLong(ev.date) + ' ?';
      $('#annulation-etape-raison').hidden = false;
      $('#annulation-etape-lieux').hidden = true;
      $('#annulation-erreur').hidden = true;
      $('#annulation-ok').hidden = false;
      $('#annulation-fermer').textContent = 'Retour';
      $('#dlg-annulation').showModal();
      f.raison.focus();
    });
  }

  function confirmerAnnulation(e) {
    e.preventDefault();
    const f = $('#form-annulation');
    const erreur = $('#annulation-erreur');
    if (!f.raison.value.trim()) {
      erreur.textContent = 'Indique la raison de l\'annulation.';
      erreur.hidden = false;
      return;
    }
    const bouton = $('#annulation-ok');
    bouton.disabled = true;
    bouton.textContent = 'Annulation…';
    erreur.hidden = true;
    appel('annulerEvenement', f.dataset.calendrier, f.dataset.id, f.dataset.portee, f.raison.value)
      .then(r => {
        const lieux = $('#annulation-lieux');
        lieux.textContent = '';
        r.lieux.forEach(l => lieux.append(el('li', {},
          el('label', { class: 'case' }, el('input', { type: 'checkbox' }), ' ', el('strong', {}, l.nom), ' : ',
            l.url ? el('a', { href: l.url, target: '_blank', rel: 'noopener' }, l.url)
              : el('span', { class: 'discret' }, 'pas de lien enregistré, vérifier s\'il y a été publié')))));
        $('#annulation-etape-raison').hidden = true;
        $('#annulation-etape-lieux').hidden = false;
        bouton.hidden = true;
        $('#annulation-fermer').textContent = 'Fermer';
        return chargerMois().then(() => { $('#statut').textContent = '🚫 Annulé : « ' + r.titre + ' ».'; });
      })
      .catch(err => {
        erreur.textContent = err.message;
        erreur.hidden = false;
      })
      .finally(() => {
        bouton.disabled = false;
        bouton.textContent = 'Annuler l\'évènement';
      });
  }

  // Demande confirmation, puis lance action() (une promesse)
  function confirmerSuppression(texte, action, libelle) {
    $('#suppr-titre').textContent = (libelle || 'Supprimer') + ' ?';
    $('#suppr-ok').textContent = libelle || 'Supprimer';
    $('#suppr-texte').textContent = texte;
    const dlg = $('#dlg-suppr');
    $('#suppr-ok').onclick = () => {
      $('#suppr-ok').disabled = true;
      action()
        .catch(e => {
          const statut = $('#dlg-corrections').open ? '#corrections-statut' : $('#dlg-charte').open ? '#charte-statut' : '#statut';
          $(statut).textContent = '❌ ' + e.message;
        })

  // ---------- Aperçu sur le site ----------
  // Reprend openEventModal() et ses fonctions de docs/index.html (dépôt calendrier-d12) : à garder alignés.

  function linkifySite(html) {
    return html.split(/(<a\b[^>]*>[\s\S]*?<\/a>|<[^>]*>)/i).map((part, i) => {
      if (i % 2) return part;
      return part.replace(/https?:\/\/(?:(?!&nbsp;)[^\s<>"'])+/gi, url => {
        const fin = url.match(/[.,;:!?)\]]+$/);
        const lien = fin ? url.slice(0, -fin[0].length) : url;
        return `<a href="${lien}" target="_blank" rel="noopener">${lien}</a>${fin ? fin[0] : ''}`;
      });
    }).join('');
  }

  function extractInscriptionSite(description) {
    const re = /(?:<(?!br)[a-z][^>]*>\s*)*inscription(?:\s|&nbsp;|<[^>]*>)*:([\s\S]*?)(?=<br\s*\/?>|\n|<\/p>|<\/div>|$)/i;
    const match = description.match(re);
    if (!match) return { description, inscription: null };
    const rest = match[1];
    const url = rest.match(/https?:\/\/[^\s"'<>]+/);
    const text = rest.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
    let inscription = null;
    if (url) inscription = { url: url[0].replace(/&amp;/g, '&') };
    else if (/^aucune/i.test(text)) inscription = { none: true };
    else return { description, inscription: null };
    const cleaned = description.replace(match[0], '').replace(/^(?:\s|<br\s*\/?>)+|(?:\s|<br\s*\/?>)+$/gi, '');
    return { description: cleaned, inscription };
  }

  function extractCanauxSite(description) {
    const canaux = {};
    const re = /(^|\n|<br\s*\/?>|<p[^>]*>|<div[^>]*>)(?:<(?!br)[a-z][^>]*>\s*)*(vibes|meetup|discord|instagram)(?:\s|&nbsp;|<[^>]*>)*:([^\n]*?)(?=<br\s*\/?>|\n|<\/p>|<\/div>|$)/gi;
    const cleaned = description.replace(re, (ligne, avant, canal, rest) => {
      const url = rest.match(/https?:\/\/[^\s"'<>]+/);
      if (!url) return ligne;
      canaux[canal.toLowerCase()] = url[0].replace(/&amp;/g, '&');
      return /^(\n|<br)/i.test(avant) ? '' : avant;
    }).replace(/^(?:\s|<br\s*\/?>)+|(?:\s|<br\s*\/?>)+$/gi, '');
    return { description: cleaned, canaux };
  }

  // ev : champs du formulaire (évènement de la liste ou formulaire en cours) ; description : partie publique écrite
  function afficherApercu(ev, description) {
    const avertissements = [];
    if (ev.visibilite === 'privee') avertissements.push('🔒 Évènement privé : il n\'apparaît pas sur le site.');
    if (etat.mode === 'modele') avertissements.push('📋 Modèle : la date est celle du jour, pour l\'exemple.');

    const parsed = extractInscriptionSite(description);
    let texte = parsed.description;
    const inscription = parsed.inscription;
    const cat = (etat.categories[ev.calendrier] || []).find(c => c.colorId === ev.colorId);
    const date = ev.date || aujourdhui();
    const fin = ev.journeeEntiere ? (ev.dateFin || date) + 'T23:59' : (ev.heureFin <= ev.heureDebut ? ajouterJour(date) : date) + 'T' + ev.heureFin;
    let mode = null;
    if (new Date(fin) < new Date()) avertissements.push('⌛ Évènement terminé : le site n\'affiche plus de bouton.');
    else if (inscription) mode = inscription.url ? 'externe' : null;
    else mode = cat ? cat.bouton : null;

    let canaux = {};
    if (mode === 'inscription' || mode === 'reservation') ({ description: texte, canaux } = extractCanauxSite(texte));
    texte = linkifySite(texte);

    const jour = versDate(date).toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const quand = ev.journeeEntiere ? jour : `${jour} à ${ev.heureDebut}`;

    const corps = $('#apercu-corps');
    corps.textContent = '';
    corps.append(el('h3', {}, '📅 Date et heure'), el('p', {}, quand));
    if (texte) {
      const p = el('p', { style: 'white-space: pre-wrap;' });
      p.innerHTML = texte; // même rendu que le site : texte déjà échappé par l'outil, liens ajoutés par linkifySite
      corps.append(el('h3', {}, '📝 Description'), p);
    }
    if (ev.lieu) corps.append(el('h3', {}, '📍 Lieu'), el('p', {}, ev.lieu));
    corps.append(el('h3', {}, 'Type'), el('p', {}, ev.calendrier === 'jds' ? '🎯 Jeux de société' : '⚔️ Jeux de rôle'));

    if (mode) {
      const noms = { discord: 'Discord', instagram: 'Instagram', meetup: 'Meetup', vibes: 'Vibes' };
      const propres = Object.keys(canaux).map(c => noms[c]);
      const libelle = mode === 'externe' ? '✋ S\'inscrire sur le site de l\'organisateur'
        : mode === 'reservation' ? '🔑 Demander à réserver la salle' : '✋ Demander à m’inscrire';
      corps.append(el('div', { class: 'inscription' },
        el('span', { class: 'site-btn-plein', title: mode === 'externe' ? inscription.url : '' }, libelle),
        mode === 'externe'
          ? el('p', { class: 'insc-aide' }, 'Ouvre : ' + inscription.url)
          : el('p', { class: 'insc-aide' }, 'Ouvre un petit formulaire (prénom, nombre de personnes) puis Mail, Discord, Instagram' +
            (mode === 'inscription' ? ', Meetup, Vibes' : '') + '.' +
            (propres.length ? ' Liens propres à cet évènement : ' + propres.join(', ') + '.' : ' Liens habituels du bar.'))));
    } else if (!avertissements.some(a => a.startsWith('⌛'))) {
      corps.append(el('p', { class: 'insc-aide' }, 'Pas de bouton d\'inscription sur le site.'));
    }

    $('#apercu-titre').textContent = ev.titre || 'Détails de l\'événement';
    $('#apercu-avertissements').hidden = !avertissements.length;
    $('#apercu-avertissements').textContent = avertissements.join(' ');
    $('#dlg-apercu').showModal();
  }

  function ajouterJour(s) {
    const d = versDate(s);

  function afficherCorrections(resultats) {
    const liste = $('#liste-corrections');
    liste.textContent = '';
    const aCorriger = resultats.filter(r => r.changements.length).length;
    $('#corrections-statut').textContent = resultats.length
      ? `${aCorriger} évènement(s) à corriger, ${resultats.length - aCorriger} à reprendre seulement à la main.`
      : '✅ Tout est déjà au format de la charte sur cette période.';

    // Groupes par catégorie, dans l'ordre des catégories
    const groupes = {};
    resultats.forEach(r => {
      const cat = (etat.categories[r.calendrier] || []).find(c => c.colorId === r.colorId);
      const cle = r.calendrier + '|' + r.colorId;
      (groupes[cle] = groupes[cle] || { cat, nom: (r.calendrier === 'jds' ? '🎯 ' : '⚔️ ') + (cat ? cat.nom : r.colorId ? 'Couleur ' + r.colorId + ' (hors catégorie)' : 'Sans catégorie'), items: [] }).items.push(r);
    });
    // JDS puis JDR, dans l'ordre des catégories ; hors catégorie à la fin
    const rang = cle => {
      const [cal, colorId] = cle.split('|');
      const i = (etat.categories[cal] || []).findIndex(c => c.colorId === colorId);
      return (cal === 'jds' ? 0 : 100) + (i === -1 ? 99 : i);
    };
    Object.keys(groupes).sort((a, b) => rang(a) - rang(b)).forEach(cle => {
      const g = groupes[cle];
      const cases = [];
      const toutes = el('input', { type: 'checkbox', checked: '', onchange: e => { cases.forEach(c => { c.checked = e.target.checked; }); majBoutonAppliquer(); } });
      const section = el('section', { class: 'groupe-corrections' },
        el('h3', {}, g.items.some(r => r.changements.length) && toutes, `${g.nom} (${g.items.length})`));
      g.items.forEach(r => {
        const coche = r.changements.length > 0 && el('input', { type: 'checkbox', checked: '', 'data-calendrier': r.calendrier, 'data-id': r.id, onchange: majBoutonAppliquer });
        if (coche) cases.push(coche);
        const quand = (r.serie ? '🔁 série depuis le ' : '') + jourLong(r.date);
        section.append(el('article', { class: 'correction', style: `border-left-color: ${g.cat ? g.cat.teinte : 'var(--texte-doux)'}` },
          el('label', { class: 'case' }, coche, r.titre !== r.titreCorrige ? `${r.titre} → ${r.titreCorrige}` : r.titre),
          el('div', { class: 'discret' }, quand, ' · ', el('a', { href: r.lienGoogle, target: '_blank', rel: 'noopener' }, 'Google Agenda')),
          el('ul', {},
            r.changements.map(c => el('li', {}, c)),
            r.aVerifier.map(a => el('li', { class: 'a-verifier' }, '⚠️ À corriger à la main : ' + a))),
          r.changements.length > 0 && el('details', {}, el('summary', {}, 'Aperçu de la description'),
            el('div', { class: 'apercu' },
              el('div', {}, el('strong', {}, 'Avant'), el('pre', {}, r.avant || '(vide)')),
              el('div', {}, el('strong', {}, 'Après'), el('pre', {}, r.apres || '(vide)'))))
        ));
      });
      liste.append(section);
    });
    majBoutonAppliquer();
  }

  function selectionCorrections() {

  function appliquerCorrections() {
    const selection = selectionCorrections();
    confirmerSuppression(`Réécrire le titre et la description de ${selection.length} évènement(s) dans Google Agenda ? ` +
      'Chaque modification est notée dans le journal.', () => {

            (r.erreurs.length ? ` ❌ ${r.erreurs.length} erreur(s) : ${r.erreurs.join(' ; ')}` : '');

  $('#mois-precedent').addEventListener('click', () => {

  });
  $('#mois-suivant').addEventListener('click', () => {
    if (++etat.mois > 11) { etat.mois = 0; etat.annee++; }
    chargerMois();
  });
  document.querySelectorAll('.filtre').forEach(b => b.addEventListener('click', () => {
    etat.filtre = b.dataset.filtre;
    document.querySelectorAll('.filtre').forEach(x => x.classList.toggle('actif', x === b));
    afficherListe();
  }));
  $('#btn-nouveau').addEventListener('click', nouveau);
  $('#btn-journal').addEventListener('click', () => {
    // Fenêtre ouverte tout de suite (sinon bloquée par le navigateur), adresse ajoutée ensuite
    const fenetre = window.open('', '_blank');
    appel('lienJournal').then(url => { if (fenetre) fenetre.location = url; else window.open(url, '_blank'); })
      .catch(e => { if (fenetre) fenetre.close(); $('#statut').textContent = '❌ ' + e.message; });
  });
  $('#btn-annuler').addEventListener('click', () => $('#dlg-form').close());
  $('#btn-charte').addEventListener('click', ouvrirCharte);
  $('#btn-apercu-form').addEventListener('click', apercuFormulaire);
  $('#apercu-fermer').addEventListener('click', () => $('#dlg-apercu').close());
  $('#btn-corrections').addEventListener('click', ouvrirCorrections);
  $('#corrections-fermer').addEventListener('click', () => $('#dlg-corrections').close());
  $('#form-corrections').addEventListener('submit', analyserCorrections);
  $('#btn-appliquer').addEventListener('click', appliquerCorrections);
  $('#charte-fermer').addEventListener('click', () => $('#dlg-charte').close());
  $('#btn-nouveau-modele').addEventListener('click', nouveauModele);
  $('#btn-nouveau-texte').addEventListener('click', () => ouvrirTexte(null));
  $('#btn-modeles-charte').addEventListener('click', ajouterModelesDeLaCharte);
  $('#texte-annuler').addEventListener('click', () => $('#dlg-texte').close());
  $('#form-texte').addEventListener('submit', enregistrerTexte);
  $('#choix-modele').addEventListener('change', appliquerModele);
  $('#inserer-texte').addEventListener('change', insererTexte);
  $('#suppr-annuler').addEventListener('click', () => $('#dlg-suppr').close());
  $('#form-annulation').addEventListener('submit', confirmerAnnulation);
  $('#annulation-fermer').addEventListener('click', () => $('#dlg-annulation').close());
  form.addEventListener('submit', enregistrer);
  form.calendrier.addEventListener('change', () => { remplirCategories(form.calendrier.value, ''); appliquerDefautsCategorie(); });
  form.colorId.addEventListener('change', () => { majAideCategorie(); appliquerDefautsCategorie(); });
  form.addEventListener('change', majVisibiliteChamps);

  chargerMois().then(chargerCharte); // catégories d'abord : la charte les affiche
</script>
